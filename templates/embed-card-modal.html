<dialog id="custom_generation_embed_card_dialog" class="cg-dialog">
    <div class="cg-dialog__panel">
        <div class="cg-dialog__header">
            <div class="cg-dialog__titlegroup">
                <i class="cg-dialog__icon fa-solid fa-link"></i>
                <h3 class="cg-dialog__title" data-i18n="Linked Card Presets">Linked Card Presets</h3>
            </div>
            <form method="dialog" class="cg-dialog__closeform">
                <button class="cg-dialog__close fa-solid fa-xmark" type="submit" title="Close" data-i18n="[title]Close"></button>
            </form>
        </div>

        <div class="cg-dialog__body">
            <small class="cg-hint" data-i18n="Embed card presets help">Select presets to link to this character card. Linked presets can be imported later.</small>
            <div id="custom_generation_embed_card_list" class="cg-list cg-list--scroll" no-items-text="No presets" data-i18n="[no-items-text]No presets"></div>
        </div>

        <div class="cg-dialog__footer">
            <div class="cg-dialog__footer-actions">
                <button id="custom_generation_embed_card_cancel" class="cg-btn" type="button" data-i18n="Cancel">Cancel</button>
                <button id="custom_generation_embed_card_save" class="cg-btn cg-btn--primary" type="button" data-i18n="Save">Save</button>
            </div>
        </div>
    </div>
</dialog>
