<dialog id="custom_generation_large_editor_dialog" class="cg-dialog cg-dialog--xl cg-dialog--fill">
    <div class="cg-dialog__panel">
        <div class="cg-dialog__header">
            <div class="cg-dialog__titlegroup">
                <i class="cg-dialog__icon fa-solid fa-pen-to-square"></i>
                <h3 id="custom_generation_large_editor_title" class="cg-dialog__title" data-i18n="Large Editor">Large Editor</h3>
            </div>
            <form method="dialog" class="cg-dialog__closeform">
                <button class="cg-dialog__close fa-solid fa-xmark" type="submit" title="Close" data-i18n="[title]Close"></button>
            </form>
        </div>

        <div class="cg-dialog__body">
            <div class="cg-field">
                <textarea id="custom_generation_large_editor_textarea"></textarea>
            </div>
        </div>

        <div class="cg-dialog__footer">
            <small class="cg-hint" data-i18n="cg_large_editor_hint">Ctrl+Enter to save</small>
            <div class="cg-dialog__footer-actions">
                <button id="custom_generation_large_editor_cancel" class="cg-btn" type="button" data-i18n="Cancel">Cancel</button>
                <button id="custom_generation_large_editor_save" class="cg-btn cg-btn--primary" type="button" data-i18n="Save">Save</button>
            </div>
        </div>
    </div>
</dialog>
