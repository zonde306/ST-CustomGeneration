<dialog id="custom_generation_tool_dialog" class="cg-dialog cg-dialog--sm">
    <div class="cg-dialog__panel">
        <div class="cg-dialog__header">
            <div class="cg-dialog__titlegroup">
                <i class="cg-dialog__icon fa-solid fa-screwdriver-wrench"></i>
                <h3 class="cg-dialog__title" data-i18n="Tool Editor">Tool Editor</h3>
            </div>
            <form method="dialog" class="cg-dialog__closeform">
                <button class="cg-dialog__close fa-solid fa-xmark" type="submit" title="Close" data-i18n="[title]Close"></button>
            </form>
        </div>

        <div class="cg-dialog__body">
            <div class="cg-field">
                <label class="cg-field__label" for="custom_generation_tool_name">
                    <span data-i18n="Name">Name</span>
                </label>
                <div id="custom_generation_tool_name" class="cg-readonly cg-mono"></div>
                <small class="cg-hint" data-i18n="cg_tool_name_help">
                    Tool name is defined in code and cannot be changed.
                </small>
            </div>

            <label class="cg-check" for="custom_generation_tool_enabled">
                <input id="custom_generation_tool_enabled" type="checkbox" />
                <span data-i18n="Enabled">Enabled</span>
            </label>

            <div class="cg-field">
                <label class="cg-field__label" for="custom_generation_tool_triggers">
                    <span data-i18n="Triggers (comma separated)">Triggers (comma separated)</span>
                </label>
                <select id="custom_generation_tool_triggers" class="text_pole" multiple="multiple" data-placeholder="normal, @@record"></select>
                <small class="cg-hint" data-i18n="cg_tool_triggers_help">
                    Select which generation types this tool should be available for.
                </small>
            </div>

            <div class="cg-field">
                <label class="cg-field__label" for="custom_generation_tool_description">
                    <span data-i18n="Description">Description</span>
                    <span class="cg-spacer"></span>
                    <i class="custom_generation_large_editor_button fa-solid fa-expand" title="Open in large editor" data-i18n="[title]Open in large editor" data-target="custom_generation_tool_description"></i>
                </label>
                <textarea id="custom_generation_tool_description" class="text_pole" rows="4" placeholder="Tool description for the AI model"></textarea>
                <small class="cg-hint" data-i18n="cg_tool_description_help">
                    The description that will be sent to the AI model to explain what this tool does.
                </small>
            </div>

            <div class="cg-section-title">
                <i class="fa-solid fa-sliders"></i>
                <span data-i18n="Parameters">Parameters</span>
            </div>
            <div id="custom_generation_tool_parameters_container"></div>
            <small class="cg-hint" data-i18n="cg_tool_parameters_help">
                Parameter descriptions that will be sent to the AI model.
            </small>
        </div>

        <div class="cg-dialog__footer">
            <div class="cg-dialog__footer-actions">
                <button id="custom_generation_tool_cancel" class="cg-btn" type="button" data-i18n="Cancel">Cancel</button>
                <button id="custom_generation_tool_save" class="cg-btn cg-btn--primary" type="button" data-i18n="Save">Save</button>
            </div>
        </div>
    </div>
</dialog>
