<dialog id="custom_generation_overrides_dialog" class="cg-dialog cg-dialog--lg">
    <div class="cg-dialog__panel">
        <div class="cg-dialog__header">
            <div class="cg-dialog__titlegroup">
                <i class="cg-dialog__icon fa-solid fa-book"></i>
                <h3 class="cg-dialog__title" data-i18n="Overrides">Overrides</h3>
            </div>
            <form method="dialog" class="cg-dialog__closeform">
                <button class="cg-dialog__close fa-solid fa-xmark" type="submit" title="Close" data-i18n="[title]Close"></button>
            </form>
        </div>

        <div class="cg-dialog__body">
            <small class="cg-hint" data-i18n="Overrides help">Review world info and chat message overrides.</small>
            <div id="custom_generation_overrides_list" class="cg-list" no-items-text="No overrides" data-i18n="[no-items-text]No overrides"></div>
        </div>

        <div class="cg-dialog__footer">
            <div class="cg-dialog__footer-actions">
                <button id="custom_generation_overrides_close" class="cg-btn cg-btn--primary" type="button" data-i18n="Close">Close</button>
            </div>
        </div>
    </div>
</dialog>
