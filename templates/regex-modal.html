<dialog id="custom_generation_regex_dialog" class="cg-dialog cg-dialog--lg">
    <div class="cg-dialog__panel">
        <div class="cg-dialog__header">
            <div class="cg-dialog__titlegroup">
                <i class="cg-dialog__icon fa-solid fa-code"></i>
                <h3 class="cg-dialog__title" data-i18n="Regex Editor">Regex Editor</h3>
            </div>
            <form method="dialog" class="cg-dialog__closeform">
                <button class="cg-dialog__close fa-solid fa-xmark" type="submit" title="Close" data-i18n="[title]Close"></button>
            </form>
        </div>

        <div class="cg-dialog__body">
            <div class="cg-field">
                <label class="cg-field__label" for="custom_generation_regex_name">
                    <span data-i18n="Script Name">Script Name</span>
                </label>
                <input id="custom_generation_regex_name" class="text_pole" type="text" />
            </div>

            <div class="cg-field">
                <label class="cg-field__label" for="custom_generation_regex_regex">
                    <span data-i18n="Find Regex">Find Regex</span>
                </label>
                <input id="custom_generation_regex_regex" class="text_pole cg-mono" type="text" />
            </div>

            <div class="cg-field">
                <label class="cg-field__label" for="custom_generation_regex_replace">
                    <span data-i18n="Replace With">Replace With</span>
                </label>
                <textarea id="custom_generation_regex_replace" class="text_pole cg-mono" rows="5"></textarea>
            </div>

            <div class="cg-section-title">
                <i class="fa-solid fa-filter"></i>
                <span data-i18n="Affects">Affects</span>
            </div>
            <div class="cg-checkgrid">
                <label class="cg-check" for="custom_generation_regex_user_input">
                    <input id="custom_generation_regex_user_input" type="checkbox" />
                    <span data-i18n="ext_regex_user_input">User Input</span>
                </label>
                <label class="cg-check" for="custom_generation_regex_ai_output">
                    <input id="custom_generation_regex_ai_output" type="checkbox" />
                    <span data-i18n="ext_regex_ai_output">AI Output</span>
                </label>
                <label class="cg-check" for="custom_generation_regex_world_info">
                    <input id="custom_generation_regex_world_info" type="checkbox" />
                    <span data-i18n="World Info">World Info</span>
                </label>
                <label class="cg-check" for="custom_generation_regex_request">
                    <input id="custom_generation_regex_request" type="checkbox" />
                    <span data-i18n="During generation">During generation</span>
                </label>
                <label class="cg-check" for="custom_generation_regex_response">
                    <input id="custom_generation_regex_response" type="checkbox" />
                    <span data-i18n="During response">During response</span>
                </label>
                <label class="cg-check" for="custom_generation_regex_ephemerality">
                    <input id="custom_generation_regex_ephemerality" type="checkbox" />
                    <span data-i18n="Ephemerality">Ephemerality</span>
                </label>
                <label class="cg-check" for="custom_generation_regex_enable">
                    <input id="custom_generation_regex_enable" type="checkbox" />
                    <span data-i18n="Enabled">Enabled</span>
                </label>
            </div>

            <div class="cg-section-title">
                <i class="fa-solid fa-layer-group"></i>
                <span data-i18n="Depth">Depth</span>
            </div>
            <div class="cg-row">
                <div class="cg-field">
                    <label class="cg-field__label" for="custom_generation_regex_min_depth">
                        <span data-i18n="Min Depth">Min Depth</span>
                    </label>
                    <input id="custom_generation_regex_min_depth" class="text_pole" type="number" min="-1" max="9999" placeholder="Unlimited" data-i18n="[placeholder]ext_regex_min_depth_placeholder" />
                </div>
                <div class="cg-field">
                    <label class="cg-field__label" for="custom_generation_regex_max_depth">
                        <span data-i18n="Max Depth">Max Depth</span>
                    </label>
                    <input id="custom_generation_regex_max_depth" class="text_pole" type="number" min="0" max="9999" placeholder="Unlimited" data-i18n="[placeholder]ext_regex_min_depth_placeholder" />
                </div>
            </div>
        </div>

        <div class="cg-dialog__footer">
            <a id="custom_generation_regex_delete" class="cg-btn cg-btn--danger cg-btn--icon fa-solid fa-trash" title="Delete" data-i18n="[title]Delete"></a>
            <div class="cg-dialog__footer-actions">
                <button id="custom_generation_regex_cancel" class="cg-btn" type="button" data-i18n="Cancel">Cancel</button>
                <button id="custom_generation_regex_save_as" class="cg-btn" type="button" style="display: none;" data-i18n="Save As">Save As</button>
                <button id="custom_generation_regex_save" class="cg-btn cg-btn--primary" type="button" data-i18n="Save">Save</button>
            </div>
        </div>
    </div>
</dialog>
