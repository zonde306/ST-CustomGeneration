<dialog id="custom_generation_prompt_dialog" class="cg-dialog cg-dialog--lg">
    <div class="cg-dialog__panel">
        <div class="cg-dialog__header">
            <div class="cg-dialog__titlegroup">
                <i class="cg-dialog__icon fa-solid fa-comment-dots"></i>
                <h3 class="cg-dialog__title" data-i18n="prompt_manager_edit">Prompt Editor</h3>
            </div>
            <form method="dialog" class="cg-dialog__closeform">
                <button class="cg-dialog__close fa-solid fa-xmark" type="submit" title="Close" data-i18n="[title]Close"></button>
            </form>
        </div>

        <div class="cg-dialog__body">
            <div class="cg-field">
                <label class="cg-field__label" for="custom_generation_prompt_name">
                    <span data-i18n="Name">Name</span>
                </label>
                <input id="custom_generation_prompt_name" class="text_pole" type="text" />
            </div>

            <div class="cg-row">
                <div class="cg-field">
                    <label class="cg-field__label" for="custom_generation_prompt_role">
                        <span data-i18n="Role">Role</span>
                    </label>
                    <select id="custom_generation_prompt_role" class="text_pole">
                        <option value="system" data-i18n="System">System</option>
                        <option value="user" data-i18n="User">User</option>
                        <option value="assistant" data-i18n="Assistant">Assistant</option>
                    </select>
                </div>
                <div class="cg-field">
                    <label class="cg-field__label" for="custom_generation_prompt_injection_position">
                        <span data-i18n="injection_position">Position</span>
                    </label>
                    <select id="custom_generation_prompt_injection_position" class="text_pole">
                        <option value="relative" data-i18n="prompt_manager_relative">Relative (to other prompts in prompt manager)</option>
                        <option value="inChat" data-i18n="prompt_manager_in_chat">In-chat @ Depth</option>
                    </select>
                </div>
            </div>

            <div id="custom_generation_prompt_inchat_controls" class="cg-row" style="display: none;">
                <div class="cg-field">
                    <label class="cg-field__label" for="custom_generation_prompt_injection_depth">
                        <span data-i18n="prompt_manager_depth">In-chat depth</span>
                    </label>
                    <input id="custom_generation_prompt_injection_depth" class="text_pole" type="number" min="0" step="1" />
                </div>
                <div class="cg-field">
                    <label class="cg-field__label" for="custom_generation_prompt_injection_order">
                        <span data-i18n="prompt_manager_order">In-chat order</span>
                    </label>
                    <input id="custom_generation_prompt_injection_order" class="text_pole" type="number" step="1" />
                </div>
            </div>

            <div id="custom_generation_prompt_chat_history_controls" class="cg-row" style="display: none;">
                <div class="cg-field">
                    <label class="cg-field__label" for="custom_generation_prompt_max_depth">
                        <span data-i18n="Chat history max depth">Chat history max depth</span>
                    </label>
                    <input id="custom_generation_prompt_max_depth" class="text_pole" type="number" min="0" step="1" />
                </div>
            </div>

            <div class="cg-field">
                <label class="cg-field__label" for="custom_generation_prompt_triggers">
                    <span data-i18n="Triggers (comma separated)">Triggers (comma separated)</span>
                </label>
                <select id="custom_generation_prompt_triggers" class="text_pole" multiple="multiple" data-placeholder="normal, @@record"></select>
            </div>

            <div class="cg-field">
                <label class="cg-field__label" for="custom_generation_prompt_internal">
                    <span data-i18n="Internal">Internal</span>
                </label>
                <select id="custom_generation_prompt_internal" class="text_pole">
                    <option value="" data-i18n="none">none</option>
                </select>
                <small class="cg-hint" data-i18n="cg_prompt_internal_help">
                    Dynamically retrieve prompt content during generation.
                </small>
            </div>

            <div class="cg-checkgrid">
                <label class="cg-check" for="custom_generation_prompt_enable">
                    <input id="custom_generation_prompt_enable" type="checkbox" />
                    <span data-i18n="Enabled">Enabled</span>
                </label>
                <label class="cg-check" for="custom_generation_prompt_scan">
                    <input id="custom_generation_prompt_scan" type="checkbox" />
                    <span data-i18n="cg_prompt_scan">Scannable by World Info</span>
                </label>
            </div>
            <small class="cg-hint" data-i18n="cg_prompt_scan_help">
                Include this prompt's content when scanning for World Info activation, in addition to the last N messages.
            </small>

            <div class="cg-field">
                <label class="cg-field__label" for="custom_generation_prompt_content">
                    <span data-i18n="Prompt">Prompt</span>
                    <span class="cg-spacer"></span>
                    <i class="custom_generation_large_editor_button fa-solid fa-expand" title="Open in large editor" data-i18n="[title]Open in large editor" data-target="custom_generation_prompt_content"></i>
                </label>
                <textarea id="custom_generation_prompt_content" class="text_pole cg-mono" rows="10"></textarea>
            </div>
        </div>

        <div class="cg-dialog__footer">
            <a id="custom_generation_prompt_delete" class="cg-btn cg-btn--danger cg-btn--icon fa-solid fa-trash" title="Delete" data-i18n="[title]Delete"></a>
            <div class="cg-dialog__footer-actions">
                <button id="custom_generation_prompt_cancel" class="cg-btn" type="button" data-i18n="Cancel">Cancel</button>
                <button id="custom_generation_prompt_save_as" class="cg-btn" type="button" style="display: none;" data-i18n="Save As">Save As</button>
                <button id="custom_generation_prompt_save" class="cg-btn cg-btn--primary" type="button" data-i18n="Save">Save</button>
            </div>
        </div>
    </div>
</dialog>
